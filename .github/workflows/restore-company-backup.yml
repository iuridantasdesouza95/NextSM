name: Restore company Supabase backup

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Download backup
        env:
          BACKUP_URL: ${{ secrets.NEXTSM_BACKUP_URL }}
        run: |
          test -n "$BACKUP_URL"
          curl --fail --location --silent --show-error "$BACKUP_URL" -o /tmp/servicedesk-mundovem.backup
          test -s /tmp/servicedesk-mundovem.backup

      - name: Inspect backup
        run: |
          echo '--- Auth objects in backup ---'
          pg_restore --list /tmp/servicedesk-mundovem.backup | grep -E 'TABLE DATA auth[.]users|TABLE DATA auth[.]identities|TABLE auth[.]users|TABLE auth[.]identities' || true

      - name: Prepare target database
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          DB='host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require'
          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;
          TRUNCATE TABLE auth.users CASCADE;
          SQL

      - name: Restore Auth users when included in backup
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          if pg_restore --list /tmp/servicedesk-mundovem.backup | grep -qE 'TABLE DATA auth[.]users'; then
            pg_restore --host=aws-0-ca-central-1.pooler.supabase.com --port=5432 --username=postgres.byuvcguynctqftnoylno --dbname=postgres --table=auth.users --data-only --no-owner --no-acl --exit-on-error /tmp/servicedesk-mundovem.backup
          else
            echo 'Backup has no auth.users data; missing IDs will receive placeholders.'
          fi
          psql "$DB" -v ON_ERROR_STOP=1 -c 'SELECT count(*) AS auth_users_before_public FROM auth.users;' || true

      - name: Reset public schema
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          DB='host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require'
          psql "$DB" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT USAGE ON SCHEMA public TO anon, authenticated; GRANT ALL ON SCHEMA public TO postgres, service_role; ALTER SCHEMA public OWNER TO postgres; CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;'

      - name: Restore public pre-data and data
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          DB_ARGS=(--host=aws-0-ca-central-1.pooler.supabase.com --port=5432 --username=postgres.byuvcguynctqftnoylno --dbname=postgres --schema=public --no-owner --no-acl --exit-on-error)
          pg_restore "${DB_ARGS[@]}" --section=pre-data /tmp/servicedesk-mundovem.backup
          pg_restore "${DB_ARGS[@]}" --section=data /tmp/servicedesk-mundovem.backup

      - name: Create Auth placeholders for missing user_id references
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          DB='host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require'
          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            r record;
            sql text;
          BEGIN
            FOR r IN
              SELECT n.nspname AS schema_name, c.relname AS table_name, a.attname AS column_name
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              JOIN pg_attribute a ON a.attrelid = c.oid
              JOIN pg_type t ON t.oid = a.atttypid
              WHERE n.nspname = 'public'
                AND c.relkind IN ('r','p')
                AND a.attnum > 0
                AND NOT a.attisdropped
                AND a.attname = 'user_id'
                AND t.typname = 'uuid'
            LOOP
              sql := format($f$
                INSERT INTO auth.users (
                  id, aud, role, email, encrypted_password,
                  email_confirmed_at, raw_app_meta_data, raw_user_meta_data,
                  created_at, updated_at, confirmation_token, recovery_token,
                  email_change_token_new, email_change, is_sso_user, is_anonymous
                )
                SELECT x.id, 'authenticated', 'authenticated',
                  'placeholder+' || x.id::text || '@nextsm.local', '', now(),
                  '{}'::jsonb, '{}'::jsonb, now(), now(), '', '', '', '', false, false
                FROM (
                  SELECT DISTINCT %1$I AS id
                  FROM %2$I.%3$I
                  WHERE %1$I IS NOT NULL
                ) x
                WHERE NOT EXISTS (SELECT 1 FROM auth.users u WHERE u.id = x.id)
                ON CONFLICT (id) DO NOTHING
              $f$, r.column_name, r.schema_name, r.table_name);
              EXECUTE sql;
            END LOOP;
          END $$;
          SQL
          psql "$DB" -v ON_ERROR_STOP=1 -c 'SELECT count(*) AS auth_users_after_repair FROM auth.users;'

      - name: Restore public constraints and functions
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          pg_restore --host=aws-0-ca-central-1.pooler.supabase.com --port=5432 --username=postgres.byuvcguynctqftnoylno --dbname=postgres --schema=public --section=post-data --no-owner --no-acl --exit-on-error /tmp/servicedesk-mundovem.backup

      - name: Verify restored database
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          DB='host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require'
          psql "$DB" -v ON_ERROR_STOP=1 -c "SELECT count(*) AS public_tables FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';"
          psql "$DB" -v ON_ERROR_STOP=1 -c "SELECT count(*) AS auth_users FROM auth.users;"

      - name: Remove backup from runner
        if: always()
        run: rm -f /tmp/servicedesk-mundovem.backup
