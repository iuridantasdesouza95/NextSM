name: Restore company Supabase backup

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Download backup
        env:
          BACKUP_URL: ${{ secrets.NEXTSM_BACKUP_URL }}
        run: |
          test -n "$BACKUP_URL"
          curl --fail --location --silent --show-error "$BACKUP_URL" -o /tmp/servicedesk-mundovem.backup
          test -s /tmp/servicedesk-mundovem.backup
          file /tmp/servicedesk-mundovem.backup

      - name: Reset public schema
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          /usr/lib/postgresql/18/bin/psql "host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT USAGE ON SCHEMA public TO anon, authenticated; GRANT ALL ON SCHEMA public TO postgres, service_role; ALTER SCHEMA public OWNER TO postgres;'

      - name: Enable required extensions
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          /usr/lib/postgresql/18/bin/psql "host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;'

      - name: Restore public schema from backup
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          /usr/lib/postgresql/18/bin/pg_restore \
            --host=aws-0-ca-central-1.pooler.supabase.com \
            --port=5432 \
            --username=postgres.byuvcguynctqftnoylno \
            --dbname=postgres \
            --schema=public \
            --no-owner \
            --no-acl \
            --exit-on-error \
            /tmp/servicedesk-mundovem.backup

      - name: Verify restored database
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          /usr/lib/postgresql/18/bin/psql "host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) AS public_tables FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';"
          /usr/lib/postgresql/18/bin/psql "host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) AS public_functions FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public';"

      - name: Remove backup from runner
        if: always()
        run: rm -f /tmp/servicedesk-mundovem.backup
