name: Restore company Supabase backup

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Download backup
        env:
          BACKUP_URL: ${{ secrets.NEXTSM_BACKUP_URL }}
        run: |
          test -n "$BACKUP_URL"
          curl --fail --location --silent --show-error "$BACKUP_URL" -o /tmp/servicedesk-mundovem.backup
          test -s /tmp/servicedesk-mundovem.backup
          file /tmp/servicedesk-mundovem.backup

      - name: Inspect backup for Auth users
        run: |
          echo '--- Auth objects in backup ---'
          /usr/lib/postgresql/18/bin/pg_restore --list /tmp/servicedesk-mundovem.backup | grep -E 'TABLE DATA auth[.]users|TABLE DATA auth[.]identities|TABLE auth[.]users|TABLE auth[.]identities' || true

      - name: Prepare target database
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          DB='host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require'
          /usr/lib/postgresql/18/bin/psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;
          TRUNCATE TABLE auth.users CASCADE;
          SQL

      - name: Restore Auth users from backup when present
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          set -e
          if /usr/lib/postgresql/18/bin/pg_restore --list /tmp/servicedesk-mundovem.backup | grep -qE 'TABLE DATA auth[.]users'; then
            /usr/lib/postgresql/18/bin/pg_restore \
              --host=aws-0-ca-central-1.pooler.supabase.com \
              --port=5432 \
              --username=postgres.byuvcguynctqftnoylno \
              --dbname=postgres \
              --table=auth.users \
              --data-only \
              --no-owner \
              --no-acl \
              --exit-on-error \
              /tmp/servicedesk-mundovem.backup
          else
            echo 'Backup does not contain auth.users data; public references will be handled with placeholder Auth users.'
          fi
          /usr/lib/postgresql/18/bin/psql "host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require" \
            -v ON_ERROR_STOP=1 \
            -c 'SELECT count(*) AS restored_auth_users FROM auth.users;'

      - name: Reset public schema
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          DB='host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require'
          /usr/lib/postgresql/18/bin/psql "$DB" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT USAGE ON SCHEMA public TO anon, authenticated; GRANT ALL ON SCHEMA public TO postgres, service_role; ALTER SCHEMA public OWNER TO postgres; CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;'

      - name: Restore public pre-data and data
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          DB_ARGS=(--host=aws-0-ca-central-1.pooler.supabase.com --port=5432 --username=postgres.byuvcguynctqftnoylno --dbname=postgres --schema=public --no-owner --no-acl --exit-on-error)
          /usr/lib/postgresql/18/bin/pg_restore "${DB_ARGS[@]}" --section=pre-data /tmp/servicedesk-mundovem.backup
          /usr/lib/postgresql/18/bin/pg_restore "${DB_ARGS[@]}" --section=data /tmp/servicedesk-mundovem.backup

      - name: Create placeholder Auth users for orphaned public references
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          DB='host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require'
          /usr/lib/postgresql/18/bin/psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            r record;
            sql text;
          BEGIN
            FOR r IN
              SELECT
                n.nspname AS schema_name,
                c.relname AS table_name,
                a.attname AS column_name
              FROM pg_constraint fk
              JOIN pg_class c ON c.oid = fk.conrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum = fk.conkey[1]
              JOIN pg_class rc ON rc.oid = fk.confrelid
              JOIN pg_namespace rn ON rn.oid = rc.relnamespace
              WHERE fk.contype = 'f'
                AND n.nspname = 'public'
                AND rn.nspname = 'auth'
                AND rc.relname = 'users'
                AND array_length(fk.conkey, 1) = 1
                AND array_length(fk.confkey, 1) = 1
            LOOP
              sql := format($f$
                INSERT INTO auth.users (
                  id, aud, role, email, encrypted_password,
                  email_confirmed_at, raw_app_meta_data, raw_user_meta_data,
                  created_at, updated_at, confirmation_token, recovery_token,
                  email_change_token_new, email_change, is_sso_user, is_anonymous
                )
                SELECT
                  x.id,
                  'authenticated',
                  'authenticated',
                  'placeholder+' || x.id::text || '@nextsm.local',
                  '',
                  now(),
                  '{}'::jsonb,
                  '{}'::jsonb,
                  now(),
                  now(),
                  '', '', '', '', false, false
                FROM (
                  SELECT DISTINCT %1$I AS id
                  FROM %2$I.%3$I
                  WHERE %1$I IS NOT NULL
                ) x
                WHERE NOT EXISTS (SELECT 1 FROM auth.users u WHERE u.id = x.id)
                ON CONFLICT (id) DO NOTHING
              $f$, r.column_name, r.schema_name, r.table_name);
              EXECUTE sql;
            END LOOP;
          END $$;
          SQL
          /usr/lib/postgresql/18/bin/psql "$DB" -v ON_ERROR_STOP=1 -c 'SELECT count(*) AS auth_users_after_repair FROM auth.users;'

      - name: Restore Auth identities when present
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          if /usr/lib/postgresql/18/bin/pg_restore --list /tmp/servicedesk-mundovem.backup | grep -qE 'TABLE DATA auth[.]identities'; then
            /usr/lib/postgresql/18/bin/pg_restore \
              --host=aws-0-ca-central-1.pooler.supabase.com \
              --port=5432 \
              --username=postgres.byuvcguynctqftnoylno \
              --dbname=postgres \
              --table=auth.identities \
              --data-only \
              --no-owner \
              --no-acl \
              --exit-on-error \
              /tmp/servicedesk-mundovem.backup
          else
            echo 'Backup does not contain auth.identities data.'
          fi

      - name: Restore public constraints and functions
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          /usr/lib/postgresql/18/bin/pg_restore \
            --host=aws-0-ca-central-1.pooler.supabase.com \
            --port=5432 \
            --username=postgres.byuvcguynctqftnoylno \
            --dbname=postgres \
            --schema=public \
            --section=post-data \
            --no-owner \
            --no-acl \
            --exit-on-error \
            /tmp/servicedesk-mundovem.backup

      - name: Verify restored database
        env:
          PGPASSWORD: ${{ secrets.NEXTSM_DB_PASSWORD }}
        run: |
          DB='host=aws-0-ca-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.byuvcguynctqftnoylno sslmode=require'
          /usr/lib/postgresql/18/bin/psql "$DB" -v ON_ERROR_STOP=1 -c "SELECT count(*) AS public_tables FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';"
          /usr/lib/postgresql/18/bin/psql "$DB" -v ON_ERROR_STOP=1 -c "SELECT count(*) AS auth_users FROM auth.users;"
          /usr/lib/postgresql/18/bin/psql "$DB" -v ON_ERROR_STOP=1 -c "SELECT count(*) AS public_functions FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public';"

      - name: Remove backup from runner
        if: always()
        run: rm -f /tmp/servicedesk-mundovem.backup
