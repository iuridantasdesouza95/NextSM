name: One-time NextSM ticket workflow fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix(itsm): wire ticket updates through actor-aware RPC' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch ticket update path
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/chamado.functions.ts')
          s = p.read_text()
          old = 'const { data: updatedRows, error: updateError } = await admin.from("chamados").update(patch as never).eq("id", data.chamadoId).select("*");'
          new = 'const { data: updatedRows, error: updateError } = await admin.rpc("nextsm_update_chamado", { _chamado_id: data.chamadoId, _actor_id: context.userId, _patch: patch });'
          if old not in s:
            raise SystemExit('target update statement not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/chamado.functions.ts
          git rm .github/workflows/one-time-fix-ticket-update.yml
          git commit -m "fix(itsm): wire ticket updates through actor-aware RPC"
          git push origin main
